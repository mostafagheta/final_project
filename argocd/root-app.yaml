apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eks-addons-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mostafagheta/final_project.git
    targetRevision: dev
    path: argocd/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
