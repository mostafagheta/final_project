# Merge this key into your existing argocd-cm ConfigMap (namespace: argocd).
# Without it, ArgoCD marks the velero Application "Synced"/"Healthy" as soon as
# the BackupStorageLocation object exists, without checking whether Velero
# actually validated bucket access - this closes that gap (replaces the
# Ansible "Read/assert Velero backup storage location" tasks).
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
data:
  resource.customizations.health.velero.io_BackupStorageLocation: |
    hs = {}
    if obj.status ~= nil and obj.status.phase ~= nil then
      if obj.status.phase == "Available" then
        hs.status = "Healthy"
      elseif obj.status.phase == "Unavailable" then
        hs.status = "Degraded"
        hs.message = obj.status.message or "BackupStorageLocation unavailable"
      else
        hs.status = "Progressing"
      end
    else
      hs.status = "Progressing"
    end
    return hs
