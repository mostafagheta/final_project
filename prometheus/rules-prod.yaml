apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: petclinic-alerts-prod
  namespace: monitoring
  labels:
    release: kube-prometheus-stack

spec:
  groups:

    - name: petclinic.prod.operational
      rules:

        - alert: PetclinicAppDown
          expr: |
            up{environment="petclinic-prod"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Petclinic prod app is down
            description: >
              The Petclinic prod target has failed Prometheus
              scraping for more than 2 minutes.

        - record: petclinic:http_requests_5xx:rate5m
          expr: |
            sum by (environment) (
              rate(
                http_server_requests_seconds_count{
                  environment="petclinic-prod",
                  status=~"5.."
                }[5m]
              )
            )

          # The number of HTTP 5xx errors occurring per second during the last 5 minutes.


        - alert: PetclinicHigh5xxRate
          expr: |
            (
              sum(
                rate(
                  http_server_requests_seconds_count{
                    environment="petclinic-prod",
                    status=~"5.."
                  }[5m]
                )
              )
              /
              sum(
                rate(
                  http_server_requests_seconds_count{
                    environment="petclinic-prod"
                  }[5m]
                )
              )
            ) * 100 > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: High 5xx error rate in prod
            description: >
              More than 5% of production HTTP requests are
              returning HTTP 5xx responses for 5 minutes.

        - record: petclinic:memory_saturation:5m
          expr: |
            (
              sum(
                container_memory_working_set_bytes{
                  namespace="petclinic-prod",
                  container!="",
                  image!=""
                }
              )
              /
              sum(
                kube_pod_container_resource_limits{
                  namespace="petclinic-prod",
                  resource="memory",
                  unit="byte"
                }
              )
            ) * 100

          # The percentage of the configured container memory currently being used 

        - alert: PetclinicHighMemorySaturation
          expr: |
            petclinic:memory_saturation:5m >= 95
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Petclinic prod memory saturation is high
            description: >
              Petclinic production memory utilization has reached
              or exceeded 95% of configured container memory limits
              for 10 minutes.

        - record: petclinic:cpu_saturation:5m
          expr: |
            (
              sum(
                rate(
                  container_cpu_usage_seconds_total{
                    namespace="petclinic-prod",
                    container!="",
                    image!=""
                  }[5m]
                )
              )
              /
              sum(
                kube_pod_container_resource_limits{
                  namespace="petclinic-prod",
                  resource="cpu",
                  unit="core"
                }
              )
            ) * 100


        - alert: PetclinicHighCPUSaturation
          expr: |
            petclinic:cpu_saturation:5m >= 95
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Petclinic prod CPU saturation is high
            description: >
              Petclinic production CPU utilization has reached
              or exceeded 95% of configured container CPU limits
              for 10 minutes.

    - name: petclinic.prod.business_sli
      rules:

        - record: petclinic:add_visit:latency_sli:5m
          expr: |
            (
              sum(
                rate(
                  http_server_requests_seconds_bucket{
                    environment="petclinic-prod",
                    method="POST",
                    uri="/owners/{ownerId}/pets/{petId}/visits/new",
                    le="1.0"
                  }[5m]
                )
              )
              /
              sum(
                rate(
                  http_server_requests_seconds_count{
                    environment="petclinic-prod",
                    method="POST",
                    uri="/owners/{ownerId}/pets/{petId}/visits/new"
                  }[5m]
                )
              )
            ) * 100

          # The percentage of Add Visit requests that completed within 1 second during the last 5 minutes.


        - record: petclinic:add_visit:latency_sli:30d
          expr: |
            (
              sum(
                increase(
                  http_server_requests_seconds_bucket{
                    environment="petclinic-prod",
                    method="POST",
                    uri="/owners/{ownerId}/pets/{petId}/visits/new",
                    le="1.0"
                  }[30d]
                )
              )
              /
              sum(
                increase(
                  http_server_requests_seconds_count{
                    environment="petclinic-prod",
                    method="POST",
                    uri="/owners/{ownerId}/pets/{petId}/visits/new"
                  }[30d]
                )
              )
            ) * 100

          # The percentage of Add Visit requests that completed within 1 second over the rolling last 30 days.

        - record: petclinic:add_visit:latency_p95:seconds
          expr: |
            histogram_quantile(
              0.95,
              sum by (le, environment) (
                rate(
                  http_server_requests_seconds_bucket{
                    environment="petclinic-prod",
                    method="POST",
                    uri="/owners/{ownerId}/pets/{petId}/visits/new"
                  }[5m]
                )
              )
            )

          # The P95 response time for Add Visit during the last 5 minutes.
        - record: petclinic:add_visit:success_rate:5m
          expr: |
            (
              sum(
                rate(
                  http_server_requests_seconds_count{
                    environment="petclinic-prod",
                    method="POST",
                    uri="/owners/{ownerId}/pets/{petId}/visits/new",
                    status="302"
                  }[5m]
                )
              )
              /
              sum(
                rate(
                  http_server_requests_seconds_count{
                    environment="petclinic-prod",
                    method="POST",
                    uri="/owners/{ownerId}/pets/{petId}/visits/new"
                  }[5m]
                )
              )
            ) * 100

          # The percentage of Add Visit HTTP requests that returned during the last 5 minutes.

        - record: petclinic:add_visit:success_rate:30d
          expr: |
            (
              sum(
                increase(
                  http_server_requests_seconds_count{
                    environment="petclinic-prod",
                    method="POST",
                    uri="/owners/{ownerId}/pets/{petId}/visits/new",
                    status="302"
                  }[30d]
                )
              )
              /
              sum(
                increase(
                  http_server_requests_seconds_count{
                    environment="petclinic-prod",
                    method="POST",
                    uri="/owners/{ownerId}/pets/{petId}/visits/new"
                  }[30d]
                )
              )
            ) * 100


        - alert: PetclinicAddVisitLatencySLOBreach
          expr: |
            petclinic:add_visit:latency_sli:30d < 99
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: PetClinic Add Visit latency SLO is below 99%
            description: >
              Fewer than 99% of Add Visit operations completed
              within 1 second over the rolling 30-day window.


        - alert: PetclinicAddVisitSlow
          expr: |
            petclinic:add_visit:latency_p95:seconds > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: PetClinic Add Visit P95 latency is above 1 second
            description: >
              The P95 latency of the Add Visit operation has
              remained above 1 second for 10 minutes.

        - alert: PetclinicAddVisitSuccessRateLow
          expr: |
            petclinic:add_visit:success_rate:5m < 99.9
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: PetClinic Add Visit success rate is below 99.9%
            description: >
              Fewer than 99.9% of Add Visit HTTP requests are
              returning the expected HTTP 302 redirect.

        - alert: PetclinicAddVisitSuccessSLOBreach
          expr: |
            petclinic:add_visit:success_rate:30d < 99.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: PetClinic Add Visit success SLO is below 99.9%
            description: >
              Fewer than 99.9% of Add Visit requests returned the
              expected HTTP 302 response over the rolling 30-day window.


        - record: petclinic:find_owner:latency_sli:5m
          expr: |
            (
              sum(
                rate(
                  http_server_requests_seconds_bucket{
                    environment="petclinic-prod",
                    method="GET",
                    uri="/owners/find",
                    le="1.0"
                  }[5m]
                )
              )
              /
              sum(
                rate(
                  http_server_requests_seconds_count{
                    environment="petclinic-prod",
                    method="GET",
                    uri="/owners/find"
                  }[5m]
                )
              )
            ) * 100

          # The percentage of Find Owner requests that completed within 1 second during the last 5 minutes.


        - record: petclinic:find_owner:latency_sli:30d
          expr: |
            (
              sum(
                increase(
                  http_server_requests_seconds_bucket{
                    environment="petclinic-prod",
                    method="GET",
                    uri="/owners/find",
                    le="1.0"
                  }[30d]
                )
              )
              /
              sum(
                increase(
                  http_server_requests_seconds_count{
                    environment="petclinic-prod",
                    method="GET",
                    uri="/owners/find"
                  }[30d]
                )
              )
            ) * 100


 
        - record: petclinic:find_owner:latency_p95:seconds
          expr: |
            histogram_quantile(
              0.95,
              sum by (le, environment) (
                rate(
                  http_server_requests_seconds_bucket{
                    environment="petclinic-prod",
                    method="GET",
                    uri="/owners/find"
                  }[5m]
                )
              )
            )

          # The P95 response time for Find Owner during the last 5 minutes.

        - record: petclinic:find_owner:success_rate:5m
          expr: |
            (
              sum(
                rate(
                  http_server_requests_seconds_count{
                    environment="petclinic-prod",
                    method="GET",
                    uri="/owners/find",
                    status="200"
                  }[5m]
                )
              )
              /
              sum(
                rate(
                  http_server_requests_seconds_count{
                    environment="petclinic-prod",
                    method="GET",
                    uri="/owners/find"
                  }[5m]
                )
              )
            ) * 100

          # The percentage of Find Owner requests that returned 200 during the last 5 minutes.

        - record: petclinic:find_owner:success_rate:30d
          expr: |
            (
              sum(
                increase(
                  http_server_requests_seconds_count{
                    environment="petclinic-prod",
                    method="GET",
                    uri="/owners/find",
                    status="200"
                  }[30d]
                )
              )
              /
              sum(
                increase(
                  http_server_requests_seconds_count{
                    environment="petclinic-prod",
                    method="GET",
                    uri="/owners/find"
                  }[30d]
                )
              )
            ) * 100

        - alert: PetclinicFindOwnerLatencySLOBreach
          expr: |
            petclinic:find_owner:latency_sli:30d < 99
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: PetClinic Find Owner latency SLO is below 99%
            description: >
              Fewer than 99% of Find Owner operations completed
              within 1 second over the rolling 30-day window.


        - alert: PetclinicFindOwnerSlow
          expr: |
            petclinic:find_owner:latency_p95:seconds > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: PetClinic Find Owner P95 latency is above 1 second
            description: >
              The P95 latency of the Find Owner operation has
              remained above 1 second for 10 minutes.


        - alert: PetclinicFindOwnerSuccessRateLow
          expr: |
            petclinic:find_owner:success_rate:5m < 99.9
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: PetClinic Find Owner success rate is below 99.9%
            description: >
              Fewer than 99.9% of Find Owner HTTP requests are
              returning HTTP 200 responses.

 
        - alert: PetclinicFindOwnerSuccessSLOBreach
          expr: |
            petclinic:find_owner:success_rate:30d < 99.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: PetClinic Find Owner success SLO is below 99.9%
            description: >
              Fewer than 99.9% of Find Owner requests returned
              HTTP 200 over the rolling 30-day window.

  
        - record: petclinic:add_pet:latency_sli:5m
          expr: |
            (
              sum(
                rate(
                  http_server_requests_seconds_bucket{
                    environment="petclinic-prod",
                    method="POST",
                    uri="/owners/{ownerId}/pets/new",
                    le="1.0"
                  }[5m]
                )
              )
              /
              sum(
                rate(
                  http_server_requests_seconds_count{
                    environment="petclinic-prod",
                    method="POST",
                    uri="/owners/{ownerId}/pets/new"
                  }[5m]
                )
              )
            ) * 100

          # The percentage of Add Pet requests that completed within 1 second during the last 5 minutes.

        - record: petclinic:add_pet:latency_sli:30d
          expr: |
            (
              sum(
                increase(
                  http_server_requests_seconds_bucket{
                    environment="petclinic-prod",
                    method="POST",
                    uri="/owners/{ownerId}/pets/new",
                    le="1.0"
                  }[30d]
                )
              )
              /
              sum(
                increase(
                  http_server_requests_seconds_count{
                    environment="petclinic-prod",
                    method="POST",
                    uri="/owners/{ownerId}/pets/new"
                  }[30d]
                )
              )
            ) * 100

  
        - record: petclinic:add_pet:latency_p95:seconds
          expr: |
            histogram_quantile(
              0.95,
              sum by (le, environment) (
                rate(
                  http_server_requests_seconds_bucket{
                    environment="petclinic-prod",
                    method="POST",
                    uri="/owners/{ownerId}/pets/new"
                  }[5m]
                )
              )
            )

          # Result means:
          # The P95 response time for Add Pet during the last 5 minutes
        - record: petclinic:add_pet:success_rate:5m
          expr: |
            (
              sum(
                rate(
                  http_server_requests_seconds_count{
                    environment="petclinic-prod",
                    method="POST",
                    uri="/owners/{ownerId}/pets/new",
                    status=~"2.."
                  }[5m]
                )
              )
              /
              sum(
                rate(
                  http_server_requests_seconds_count{
                    environment="petclinic-prod",
                    method="POST",
                    uri="/owners/{ownerId}/pets/new"
                  }[5m]
                )
              )
            ) * 100


          # The percentage of Add Pet requests that returned an HTTP 2xx response during the last 5 minutes.

        - record: petclinic:add_pet:success_rate:30d
          expr: |
            (
              sum(
                increase(
                  http_server_requests_seconds_count{
                    environment="petclinic-prod",
                    method="POST",
                    uri="/owners/{ownerId}/pets/new",
                    status=~"2.."
                  }[30d]
                )
              )
              /
              sum(
                increase(
                  http_server_requests_seconds_count{
                    environment="petclinic-prod",
                    method="POST",
                    uri="/owners/{ownerId}/pets/new"
                  }[30d]
                )
              )
            ) * 100


        - alert: PetclinicAddPetLatencySLOBreach
          expr: |
            petclinic:add_pet:latency_sli:30d < 99
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: PetClinic Add Pet latency SLO is below 99%
            description: >
              Fewer than 99% of Add Pet operations completed
              within 1 second over the rolling 30-day window.

        - alert: PetclinicAddPetSlow
          expr: |
            petclinic:add_pet:latency_p95:seconds > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: PetClinic Add Pet P95 latency is above 1 second
            description: >
              The P95 latency of the Add Pet operation has
              remained above 1 second for 10 minutes.


        - alert: PetclinicAddPetSuccessRateLow
          expr: |
            petclinic:add_pet:success_rate:5m < 99.9
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: PetClinic Add Pet success rate is below 99.9%
            description: >
              Fewer than 99.9% of Add Pet HTTP requests are
              returning a successful 2xx response.

        - alert: PetclinicAddPetSuccessSLOBreach
          expr: |
            petclinic:add_pet:success_rate:30d < 99.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: PetClinic Add Pet success SLO is below 99.9%
            description: >
              Fewer than 99.9% of Add Pet requests returned a
              successful 2xx response over the rolling 30-day window.

