apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: petclinic-alerts-prod
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: petclinic.prod.rules
      rules:
        - alert: PetclinicAppDown
          expr: up{environment="petclinic-prod"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Petclinic prod app is down
            description: The Petclinic prod target is not being scraped by Prometheus.

        - alert: PetclinicHigh5xxRate
          expr: sum(rate(http_server_requests_seconds_count{environment="petclinic-prod",status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count{environment="petclinic-prod"}[5m])) * 100 > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: High 5xx error rate in prod
            description: More than 5% of requests are returning 5xx in the petclinic-prod environment.

        - alert: PetclinicSlowResponses
          expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{environment="petclinic-prod"}[5m]))) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Petclinic prod response latency is too high
            description: P95 latency is above 1 second in petclinic-prod.

        - alert: PetclinicOwnersCreatedSpike
          expr: rate(petclinic_owners_created_total{environment="petclinic-prod"}[15m]) > 1
          for: 15m
          labels:
            severity: info
          annotations:
            summary: Petclinic prod owners creation is increasing
            description: Owners creation rate in prod is above 1 per second for 15 minutes.

        - alert: PetclinicPetsCreatedSpike
          expr: rate(petclinic_pets_created_total{environment="petclinic-prod"}[15m]) > 1
          for: 15m
          labels:
            severity: info
          annotations:
            summary: Petclinic prod pets creation is increasing
            description: Pets creation rate in prod is above 1 per second for 15 minutes.

        - alert: PetclinicVisitsCreatedSpike
          expr: rate(petclinic_visits_created_total{environment="petclinic-prod"}[15m]) > 1
          for: 15m
          labels:
            severity: info
          annotations:
            summary: Petclinic prod visits creation is increasing
            description: Visits creation rate in prod is above 1 per second for 15 minutes.