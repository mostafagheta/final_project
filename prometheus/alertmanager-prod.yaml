apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-slack-prod
  namespace: monitoring
  labels:
    app: kube-prometheus-stack-alertmanager
    release: kube-prometheus-stack
stringData:
  webhook_url: ""  #replace with external secret manager reference
type: Opaque
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: petclinic-alertmanager-prod
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  route:
    receiver: slack-prod
    groupBy: ['alertname', 'namespace', 'severity']
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 1h
    matchers:
      - name: environment
        matchType: '='
        value: "petclinic-prod"
  receivers:
    - name: slack-prod
      slackConfigs:
        - apiURL:
            name: alertmanager-slack-prod
            key: webhook_url
          channel: '#alerts'
          sendResolved: true
          text: |
            *Alert*: {{ .CommonLabels.alertname }}
            *Severity*: {{ .CommonLabels.severity }}
            *Environment*: {{ .CommonLabels.environment }}
            *Namespace*: {{ .CommonLabels.namespace }}
            *Summary*: {{ .CommonAnnotations.summary }}
            *Description*: {{ .CommonAnnotations.description }}
            *Alert URL*: {{ .ExternalURL }}
          title: '{{ .CommonLabels.alertname }} - {{ .Status | toUpper }}'