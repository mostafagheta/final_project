# ============================================================
# values-dev.yaml — Development Environment Overrides
# Namespace: petclinic-dev
#
# Deploy with:
#   helm upgrade --install petclinic ./petclinic \
#     -f values-dev.yaml \
#     --namespace petclinic-dev \
#     --create-namespace
# ============================================================

replicaCount: 1

image:
  repository: 130299714330.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev
  pullPolicy: Always
  tag: "latest"

fullnameOverride: "petclinic"

# Reduced resources for dev — saves cost, runs on smaller nodes
resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "postgres"

waitForDatabase:
  enabled: true

# HPA disabled in dev — single replica is enough for testing
autoscaling:
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  vpa:
    enabled: false

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
    alb.ingress.kubernetes.io/tags: "Environment=dev,Team=platform"
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

externalSecret:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ""
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: petclinic/database/dev
        property: username
    - secretKey: POSTGRES_PASS
      remoteRef:
        key: petclinic/database/dev
        property: password
    - secretKey: POSTGRES_URL
      remoteRef:
        key: petclinic/database/dev
        property: url

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  replicaCount: 1
  auth:
    existingSecret: "petclinic"
    existingSecretPasswordKey: "POSTGRES_PASS"
    database: petclinic
    username: petclinic
    password: "changeme"
  service:
    port: 5432
  persistence:
    enabled: true
    storageClass: "gp2"
    accessModes:
      - ReadWriteOnce
    size: 5Gi
  resources:
    limits:
      cpu: "500m"
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
