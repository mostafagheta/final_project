# ============================================================
# values-test.yaml — Test / QA Environment Overrides
# Namespace: petclinic-test
#
# Deploy with:
#   helm upgrade --install petclinic ./petclinic \
#     -f values-test.yaml \
#     --namespace petclinic-test \
#     --create-namespace
# ============================================================

replicaCount: 2

image:
  repository: 130299714330.dkr.ecr.eu-central-1.amazonaws.com/petclinic-test
  pullPolicy: Always
  tag: "latest"

fullnameOverride: "petclinic"

# Moderate resources — reflects production-like behaviour under test load
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "postgres"

waitForDatabase:
  enabled: true

# HPA enabled in test so autoscaling behaviour can be validated
autoscaling:
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  vpa:
    enabled: true

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
    alb.ingress.kubernetes.io/tags: "Environment=test,Team=platform"
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

externalSecret:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ""
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: petclinic/database
        property: username
    - secretKey: POSTGRES_PASS
      remoteRef:
        key: petclinic/database
        property: password
    - secretKey: POSTGRES_URL
      remoteRef:
        key: petclinic/database
        property: url

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  replicaCount: 1
  auth:
    existingSecret: "petclinic"
    existingSecretPasswordKey: "POSTGRES_PASS"
    database: petclinic
    username: petclinic
    password: "changeme"
  service:
    port: 5432
  persistence:
    enabled: true
    storageClass: "gp2"
    accessModes:
      - ReadWriteOnce
    size: 10Gi
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi
